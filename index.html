<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แบบประเมินรูปแบบการจัดการความขัดแย้ง (TKI)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5fb;--card:#fff;--tx:#1f1d2b;--mut:#6b6880;--bd:#dedbed;--ac:#6d4fd6;--acs:#ece8fb;--ok:#1d9a6c;--warn:#e63946;--warn2:#f4a261}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141c;--card:#1f1e2a;--tx:#ecebf5;--mut:#a09db5;--bd:#34324a;--ac:#9a84f0;--acs:#2b2842;--ok:#4cc79a;--warn:#ff6b6b;--warn2:#e76f51}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai",system-ui,sans-serif;line-height:1.6}
.w{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.4rem;margin:8px 0; color:var(--ac); text-align:center;}
.mut{color:var(--mut);font-size:.92rem; text-align:center;}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 2px 8px rgba(0,0,0,0.02)}
.q{font-weight:600;margin-bottom:12px; font-size: 1.1rem; color: var(--ac);}
.scale-container{display:flex; flex-direction:column; gap:8px;}
label.o{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:10px;cursor:pointer;transition:all 0.2s}
label.o:has(input:checked){background:var(--acs);border-color:var(--ac);transform:scale(1.02);}
input[type=radio]{margin:0;accent-color:var(--ac);transform:scale(1.2)}
input[type=text], select, textarea{font:inherit;width:100%;padding:12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin-bottom:12px}
input[type=text]:focus, select:focus, textarea:focus{outline:none;border-color:var(--ac)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 0;z-index:5;border-bottom:1px solid var(--bd)}
.pg{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.pg i{display:block;height:100%;width:0;background:var(--ac);transition:width .4s ease-out}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 20px;background:var(--ac);color:#fff;cursor:pointer;margin:4px 6px 4px 0;transition:all 0.2s}
button:hover{opacity:0.9; transform:translateY(-1px);}
button.s{background:var(--bd);color:var(--tx)}
button.danger{background:var(--warn);color:#fff}
button.warning{background:var(--warn2);color:#fff}
button.success{background:var(--ok);color:#fff}
button.del-btn{background:rgba(230,57,70,0.1);color:var(--warn);padding:4px 10px;font-size:0.8rem;border-radius:6px;}
button.del-btn:hover{background:var(--warn);color:#fff;}
.r{margin:10px 0}.r b{display:flex;justify-content:space-between;align-items:center;font-size:0.95rem;}.r .t{height:14px;background:var(--bd);border-radius:7px;overflow:hidden}.r .t i{display:block;height:100%;background:var(--ac)}
.r.top .t i{background:var(--ok)}
#res, #adminPanel, #submitCard{display:none}
.nav-buttons{display:flex; justify-content:space-between; margin-top:20px;}
.admin-section{margin-top:60px;padding-top:20px;border-top:2px dashed var(--bd);text-align:center}
.acc-header {display: flex;justify-content: space-between;align-items: center;cursor: pointer;padding: 12px 16px;background: var(--acs);border-radius: 10px;user-select: none;}
.acc-header:hover { opacity: 0.95; }
.acc-body { display: none; padding-top: 14px; }
.acc-body.open { display: block; }
.badge {display: inline-block;padding: 2px 8px;border-radius: 6px;font-size: 0.8rem;font-weight: bold;margin-right: 6px;}
.badge-pre {background: #e1f0ff;color: #1d72b8;border: 1px solid #b3d7ff;}
.badge-post {background: #e6f9f0;color: #1d9a6c;border: 1px solid #a3e6cb;}
.dom-card {background: var(--acs); border-radius: 12px; padding: 16px; margin: 20px 0;}
.dom-img {width: 120px; height: 120px; object-fit: contain; margin-bottom: 15px;}
@media (prefers-color-scheme:dark){
  .badge-pre { background: #1c334a; color: #72b6ff; border-color: #2b4c6f; }
  .badge-post { background: #1c3b30; color: #62e3b1; border-color: #285a48; }
}
</style>
</head>
<body>
<div class="w">
<h1>แบบประเมิน TKI: การจัดการความขัดแย้ง</h1>
<p class="mut">ค้นหารูปแบบการรับมือกับความขัดแย้งของคุณ</p>

<!-- Progress Bar -->
<div class="bar" id="topBar">
  <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-weight:bold; font-size:0.95rem;">
    <span>ความคืบหน้า</span>
    <span id="cnt" style="color:var(--ac);">ข้อที่ 1 / 15</span>
  </div>
  <div class="pg"><i id="pg"></i></div>
</div>

<div id="testArea">
  <!-- 1. ข้อมูลผู้ประเมิน -->
  <div class="card" id="infoCard" style="border:2px solid var(--ac)">
    <h2>📋 ข้อมูลเบื้องต้น</h2>
    <label style="display:block;margin-bottom:6px;font-weight:600;margin-top:10px;">ชื่อ-นามสกุล <span style="color:var(--warn)">*</span></label>
    <input type="text" id="uname" placeholder="เช่น นายสมชาย ใจดี" required>
    <label style="display:block;margin-bottom:6px;font-weight:600;">รหัสนิสิต (11 หลัก) <span style="color:var(--warn)">*</span></label>
    <input type="text" id="uid" placeholder="เช่น 67XXXXXXXXX" maxlength="11" oninput="this.value = this.value.replace(/[^0-9]/g, '');" required>
    <label style="display:block;margin-bottom:6px;font-weight:600;">ระยะเวลาการทำประเมิน <span style="color:var(--warn)">*</span></label>
    <select id="when">
      <option value="Pre-test (ก่อนทำโครงการ)">Pre-test (ก่อนทำโครงการ)</option>
      <option value="Post-test (หลังทำโครงการ)">Post-test (หลังทำโครงการ)</option>
    </select>
  </div>

  <!-- 2. แบบทดสอบ 15 ข้อ -->
  <div id="qs"></div>

  <!-- Navigation Buttons -->
  <div class="nav-buttons" id="navPanel">
    <button class="s" id="btnPrev" style="display:none;">◀ ย้อนกลับ</button>
    <button id="btnNext" style="margin-left:auto;">ถัดไป ▶</button>
  </div>

  <!-- 3. ปุ่มบันทึก (หน้าสุดท้าย) -->
  <div class="card" id="submitCard" style="border:2px solid var(--ok); text-align:center;">
    <h3 style="margin-top:0; color:var(--ok);">ตอบครบถ้วนแล้ว! 🎉</h3>
    <button class="success" id="go" style="width:100%; font-size:1.1rem; padding:14px;">💾 บันทึกและดูผลคะแนน</button>
    <button class="s" id="rs" style="width:100%; margin-top:10px;">ล้างข้อมูลและเริ่มใหม่</button>
  </div>
</div>

<!-- 4. สรุปผล -->
<div id="res">
  <div class="card" style="border:2px solid var(--ac)">
    <h2>สรุปผลการประเมินของคุณ<br><span id="rName" style="color:var(--ac); display:inline-block; margin-top:8px;"></span></h2>
    <p class="mut">รหัสนิสิต: <span id="rUid" style="font-weight:600"></span><br>
    ช่วงเวลา: <span id="rWhen" style="font-weight:600"></span><br>
    วันที่และเวลา: <span id="rDate" style="font-weight:600"></span></p>
    
    <!-- กราฟเรดาร์ (5 เหลี่ยม) -->
    <div style="max-width:400px; margin:20px auto;"><canvas id="radarChart"></canvas></div>
    
    <!-- ตัวที่โดดเด่นพร้อมคำอธิบาย -->
    <div id="domResult"></div>

    <hr style="border:0; border-top:1px dashed var(--bd); margin:20px 0;">

    <h3 style="color:var(--ac);">คะแนนของคุณในแต่ละด้าน</h3>
    <!-- หลอดคะแนน -->
    <div id="bars"></div>
    
    <div style="margin-top:30px;">
      <label style="display:block;margin-bottom:6px;font-weight:600;">รูปแบบการจัดการความขัดแย้งที่ฉันอยากจะพัฒนาคือ:</label>
      <input type="text" id="devGoal" placeholder="เช่น การร่วมมือ (Collaborating)">
      <label style="display:block;margin-bottom:6px;font-weight:600;">ฉันจะฝึกฝนรูปแบบการจัดการความขัดแย้งนี้ได้อย่างไร?:</label>
      <textarea id="devPlan" rows="3" placeholder="กรอกแนวทางการฝึกฝนของคุณ..."></textarea>
      <button class="success" id="savePlan" style="width:100%; margin-top:8px;">บันทึกแผนพัฒนาตนเอง</button>
    </div>
  </div>
</div>

<!-- ระบบหลังบ้าน (Admin) -->
<div class="admin-section">
  <button class="s" id="toggleAdmin">🔒 เปิดระบบหลังบ้าน (Admin)</button>
</div>

<div id="adminPanel">
  <div class="card" style="border:2px dashed var(--ac)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h2>📊 ระบบหลังบ้าน (Admin)</h2>
      <button class="s" id="closeAdmin" style="padding:6px 12px;">ปิด</button>
    </div>
    
    <div style="display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap;">
      <button class="success" id="genMock" style="flex:1; padding:10px 5px; min-width:30%;">✨ สร้าง Test</button>
      <button class="warning" id="clrTest" style="flex:1; padding:10px 5px; min-width:30%;">🧹 ลบเฉพาะ Test</button>
      <button class="danger" id="clrAll" style="flex:1; padding:10px 5px; min-width:30%;">🗑️ ลบทั้งหมด</button>
    </div>

    <div id="adminList"></div>
  </div>
</div>

</div>

<script>
// -- ประมวลผลและระบบจัดการข้อมูลพื้นฐาน --
var KEY="tki_project_15q";
function loadData(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return []}}
function saveData(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}

// -- ข้อมูลแบบประเมิน รูปสัตว์ และคำอธิบาย --
var N = {C:"การแข่งขัน (Competing)", Co:"การร่วมมือ (Collaborating)", Cm:"การประนีประนอม (Compromising)", Av:"การหลีกเลี่ยง (Avoiding)", Ac:"การโอนอ่อนผ่อนตาม (Accommodating)"};
var AnimalName = {C:"ฉลาม", Co:"นกฮูก", Cm:"สุนัขจิ้งจอก", Av:"เต่า", Ac:"หมีเท็ดดี้"};
var K = ["Co","C","Av","Ac","Cm"];

var ImgPath = {
  C: 'Shark_2.png', 
  Co: 'OWL_2.png', 
  Cm: 'Fox_2.png', 
  Av: 'Turtle_2.png', 
  Ac: 'Teddy_2.png'
};

var Desc = {
  Co: "นกฮูกให้ความสำคัญอย่างมากทั้งต่อเป้าหมายและความสัมพันธ์ พวกเขามองว่าความขัดแย้งคือปัญหาที่ต้องแก้ไข และแสวงหาทางออกที่บรรลุทั้งเป้าหมายของตนเองและเป้าหมายของอีกฝ่าย นกฮูกมองว่าความขัดแย้งเป็นวิธีหนึ่งในการปรับปรุงความสัมพันธ์โดยการลดความตึงเครียดระหว่างคนสองคน พวกเขาพยายามเริ่มการสนทนาที่ระบุว่าความขัดแย้งเป็นปัญหา และพยายามแก้ไขความตึงเครียดและรักษาความสัมพันธ์โดยแสวงหาทางออกที่ตอบสนองความต้องการทั้งของตนเองและอีกฝ่าย",
  Av: "เต่ามักจะให้ความสำคัญกับการหลีกเลี่ยงการเผชิญหน้ามากกว่าเป้าหมายหรือความสัมพันธ์ พวกเขามักจะพบว่าง่ายกว่าที่จะถอนตัวจากความขัดแย้งมากกว่าที่จะเผชิญหน้ากับมัน สิ่งนี้อาจรวมถึงการยอมล้มเลิกความสัมพันธ์หรือเป้าหมายที่เกี่ยวข้องกับความขัดแย้งนั้นไปเลยอย่างสิ้นเชิง",
  C: "ฉลามมักจะให้ความสำคัญกับเป้าหมายของตนเหนือความสัมพันธ์ ซึ่งหมายความว่าหากถูกบังคับให้เลือก พวกเขาจะพยายามบรรลุเป้าหมายของตนแม้ว่าจะต้องสูญเสียความสัมพันธ์ที่เกี่ยวข้องไปก็ตาม โดยทั่วไปฉลามมักจะกังวลเรื่องการบรรลุเป้าหมายมากกว่าการเป็นที่ชื่นชอบของผู้อื่น พวกเขาอาจพยายามบังคับให้คู่กรณีโอนอ่อนยอมรับทางออกของความขัดแย้งโดยใช้อำนาจที่เหนือกว่า",
  Ac: "หมีเท็ดดี้มักจะให้ความสำคัญกับความสัมพันธ์มากกว่าเป้าหมายของตนเอง หากถูกบังคับให้เลือก หมีเท็ดดี้มักจะยอมเสียสละเป้าหมายของตนเพื่อรักษาความสัมพันธ์ไว้ โดยทั่วไปหมีเท็ดดี้ต้องการให้ผู้อื่นชื่นชอบ และชอบที่จะหลีกเลี่ยงความขัดแย้งเพราะพวกเขาเชื่อว่าการพูดถึงเรื่องนี้จะทำลายความสัมพันธ์ หมีเท็ดดี้พยายามประนีประนอมไกล่เกลี่ยความขัดแย้งเพื่อป้องกันไม่ให้ความสัมพันธ์เสียหาย",
  Cm: "สุนัขจิ้งจอกมีความใส่ใจในระดับปานกลางทั้งต่อเป้าหมายของตนและต่อความสัมพันธ์กับผู้อื่น สุนัขจิ้งจอกมักจะแสวงหาการประนีประนอม พวกเขายอมสละเป้าหมายบางส่วนของตนและชักชวนให้อีกฝ่ายในความขัดแย้งยอมสละเป้าหมายบางส่วนของตนเช่นกัน พวกเขาแสวงหาทางออกของความขัดแย้งที่ทั้งสองฝ่ายได้อะไรบางอย่าง ซึ่งก็คือจุดกึ่งกลางระหว่างจุดยืนที่สุดโต่งสองฝั่ง พวกเขายินดีที่จะเสียสละเป้าหมายบางส่วนเพื่อหาข้อตกลงเพื่อผลประโยชน์ส่วนรวม"
};

var Q=[
  {q:"1. ฉันพูดคุยถึงปัญหากับผู้อื่นเพื่อพยายามหาทางออกที่ตอบสนองความต้องการของทุกคน", c:"Co"},
  {q:"2. ฉันพยายามเจรจาต่อรองและใช้วิธีการแบบถ้อยทีถ้อยอาศัย (ให้และรับ) เพื่อแก้ปัญหา", c:"Cm"},
  {q:"3. ฉันพยายามทำตามความคาดหวังของผู้อื่น", c:"Ac"},
  {q:"4. ฉันจะโต้แย้งในเรื่องของฉันและยืนกรานถึงข้อดีในมุมมองของฉัน", c:"C"},
  {q:"5. เมื่อมีความขัดแย้ง ฉันจะรวบรวมข้อมูลให้ได้มากที่สุดและเปิดโอกาสให้มีการสื่อสารกันอย่างต่อเนื่อง", c:"Co"},
  {q:"6. เมื่อฉันพบว่าตัวเองอยู่ในการโต้เถียง ฉันมักจะพูดน้อยมากและพยายามปลีกตัวออกมาให้เร็วที่สุด", c:"Av"},
  {q:"7. ฉันพยายามมองความขัดแย้งจากทั้งสองฝ่าย ฉันต้องการอะไร? อีกฝ่ายต้องการอะไร? มีประเด็นอะไรเกี่ยวข้องบ้าง?", c:"Co"},
  {q:"8. ฉันชอบที่จะประนีประนอมเมื่อต้องแก้ปัญหาและก้าวผ่านมันไป", c:"Cm"},
  {q:"9. ฉันพบว่าความขัดแย้งเป็นเรื่องน่าตื่นเต้น ฉันสนุกกับการประลองปัญญาที่มักจะตามมา", c:"C"},
  {q:"10. การมีความคิดเห็นไม่ตรงกับผู้อื่นทำให้ฉันรู้สึกอึดอัดและวิตกกังวล", c:"Av"},
  {q:"11. ฉันพยายามทำตามความต้องการของเพื่อนและครอบครัว", c:"Ac"},
  {q:"12. ฉันสามารถคิดได้ว่าอะไรควรทำ และฉันก็มักจะเป็นฝ่ายถูก", c:"C"},
  {q:"13. เพื่อแก้ปัญหาทางตัน ฉันจะประนีประนอมพบกันคนละครึ่งทาง", c:"Cm"},
  {q:"14. ฉันอาจจะไม่ได้ในสิ่งที่ต้องการ แต่มันก็เป็นเพียงราคาเล็กน้อยที่ต้องจ่ายเพื่อรักษาความสงบเอาไว้", c:"Ac"},
  {q:"15. ฉันหลีกเลี่ยงความรู้สึกที่ไม่ดีโดยเก็บความไม่ลงรอยกันที่มีต่อผู้อื่นไว้กับตัวเอง", c:"Av"}
];
var scales = [
  {v:1, l:"1 = แทบจะไม่ (Rarely)"},
  {v:2, l:"2 = บางครั้ง (Sometimes)"},
  {v:3, l:"3 = บ่อยครั้ง (Often)"},
  {v:4, l:"4 = เสมอ (Always)"}
];

var ans={};
var qs=document.getElementById("qs"), myRadarChart=null, adminCharts={};
var currentStep = 0; 

// -- ระบบสร้างเสียง --
var audioCtx;
function playHappySound() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var t = audioCtx.currentTime;
    function playTone(freq, startTime, duration) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, startTime);
      gain.gain.linearRampToValueAtTime(0.05, startTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(startTime); osc.stop(startTime + duration);
    }
    playTone(523.25, t, 0.1); playTone(659.25, t + 0.08, 0.1); playTone(783.99, t + 0.16, 0.15);
  } catch(e) { console.log("Audio not supported"); }
}

// -- สร้างข้อสอบ --
Q.forEach(function(q,i){
 var d=document.createElement("div"); d.className="card"; d.id="q"+i; d.style.display = "none";
 var html = '<div class="q">'+q.q+'</div><div class="scale-container">';
 scales.forEach(function(s){ html += '<label class="o"><input type="radio" name="q'+i+'" value="'+s.v+'" data-cat="'+q.c+'"><span>'+s.l+'</span></label>'; });
 html += '</div>'; d.innerHTML = html; qs.appendChild(d);
});

function updateView() {
  for(var i=0; i<15; i++) { document.getElementById("q"+i).style.display = "none"; }
  document.getElementById("q"+currentStep).style.display = "block";
  document.getElementById("infoCard").style.display = (currentStep === 0) ? "block" : "none";
  
  document.getElementById("btnPrev").style.display = (currentStep === 0) ? "none" : "inline-block";
  if(currentStep === 14) { document.getElementById("btnNext").style.display = "none"; document.getElementById("submitCard").style.display = "block"; } 
  else { document.getElementById("btnNext").style.display = "inline-block"; document.getElementById("submitCard").style.display = "none"; }

  var answeredCount = Object.keys(ans).length;
  document.getElementById("cnt").textContent = "ข้อที่ " + (currentStep + 1) + " / 15";
  document.getElementById("pg").style.width = ((answeredCount / 15) * 100) + "%";
  window.scrollTo({top:0, behavior:"smooth"});
}

qs.addEventListener("change",function(e){
  var m = e.target.name.slice(1);
  ans[m] = {val:parseInt(e.target.value), cat:e.target.dataset.cat};
  playHappySound(); 
  document.getElementById("pg").style.width = ((Object.keys(ans).length / 15) * 100) + "%";
});

document.getElementById("btnNext").onclick = function() {
  if (currentStep === 0) {
    var uName = document.getElementById("uname").value.trim(), uId = document.getElementById("uid").value.trim();
    if (!uName || !uId) { alert("⚠️ กรุณากรอกชื่อ-นามสกุล และรหัสนิสิตให้ครบถ้วนก่อน"); document.getElementById("infoCard").scrollIntoView({behavior:"smooth"}); return; }
    if (uId.length !== 11 || !/^\d{11}$/.test(uId)) {
      alert("⚠️ กรุณากรอกรหัสนิสิตเป็นตัวเลข 11 หลักให้ถูกต้อง");
      document.getElementById("uid").focus(); return;
    }
  }
  if (!ans[currentStep]) { alert("⚠️ กรุณาเลือกคำตอบก่อนไปข้อถัดไป"); return; }
  if (currentStep < 14) { currentStep++; updateView(); }
};

document.getElementById("btnPrev").onclick = function() { if (currentStep > 0) { currentStep--; updateView(); } };
updateView();

function createRadarChart(canvasId, scores) {
  var ctx = document.getElementById(canvasId).getContext('2d');
  return new Chart(ctx, {
    type: 'radar',
    data: {
      labels: ['ร่วมมือ', 'แข่งขัน', 'หลีกเลี่ยง', 'โอนอ่อน', 'ประนีประนอม'],
      datasets: [{ label: 'คะแนน', data: [scores.Co, scores.C, scores.Av, scores.Ac, scores.Cm], backgroundColor: 'rgba(109, 79, 214, 0.2)', borderColor: '#6d4fd6', pointBackgroundColor: '#6d4fd6', borderWidth: 2 }]
    },
    options: { responsive: true, maintainAspectRatio: true, scales: { r: { min: 0, max: 12, ticks: { stepSize: 3 } } } }
  });
}

var currentUserId = null;
document.getElementById("go").onclick=function(){
  if (!ans[14]) { alert("⚠️ กรุณาตอบคำถามข้อสุดท้ายให้เรียบร้อย"); return; }
  
  var uName=document.getElementById("uname").value.trim(), uId=document.getElementById("uid").value.trim();
  var s={C:0,Co:0,Cm:0,Av:0,Ac:0};
  for(var k in ans){ s[ans[k].cat] += ans[k].val; }
  var w=document.getElementById("when").value, mx=Math.max.apply(null,K.map(function(k){return s[k]})), nowStr=new Date().toLocaleString("th-TH");
  
  var tops = K.filter(function(k){return s[k]===mx});
  
  // ใช้ชื่อบุคลิก TKI ภาษาไทยสำหรับแสดงในวงเล็บ
  var domTkiNames = tops.map(function(k){ return N[k].split(" (")[0] }).join(", ");

  document.getElementById("testArea").style.display = "none";
  document.getElementById("topBar").style.display = "none";
  document.getElementById("res").style.display = "block";
  
  // แสดงชื่อและบุคลิก TKI ภาษาไทย
  document.getElementById("rName").textContent = uName + " (" + domTkiNames + ")"; 
  document.getElementById("rUid").textContent=uId; 
  document.getElementById("rWhen").textContent=w; 
  document.getElementById("rDate").textContent=nowStr;
  
  document.getElementById("bars").innerHTML=K.map(function(k){
    return '<div class="r'+(s[k]===mx?" top":"")+'"><b><span>'+N[k]+'</span><span>'+s[k]+'/12</span></b><div class="t"><i style="width:'+(s[k]/12*100)+'%"></i></div></div>'
  }).join("");
  
  // แสดงรูปสัตว์และคำอธิบายในหน้าสรุปผล
  var domHtml = tops.map(function(k){
    return '<div class="dom-card" style="text-align:center;">' +
           '<img src="'+ImgPath[k]+'" class="dom-img" alt="'+AnimalName[k]+'">' +
           '<h3 style="color:var(--ac); margin:0 0 10px 0;">' + AnimalName[k] + ' - ' + N[k] + '</h3>' +
           '<p style="text-align:left; font-size:0.95rem; margin:0;">' + Desc[k] + '</p>' +
           '</div>';
  }).join("");
  document.getElementById("domResult").innerHTML = domHtml;

  if(myRadarChart) myRadarChart.destroy(); myRadarChart = createRadarChart('radarChart', s);
  
  var h=loadData(); currentUserId = Date.now();
  h.push({id_ref: currentUserId, n:uName, id:uId, w:w, d:nowStr, s:s}); saveData(h); renderAdminList();
  window.scrollTo({top:0, behavior:"smooth"});
};

document.getElementById("savePlan").onclick=function(){
  var goal = document.getElementById("devGoal").value.trim(), plan = document.getElementById("devPlan").value.trim();
  if(!goal || !plan) { alert("กรุณากรอกข้อมูลแผนพัฒนาตนเองให้ครบ"); return; }
  var h=loadData(), idx = h.findIndex(function(x){return x.id_ref === currentUserId});
  if(idx > -1) { h[idx].plan = {goal: goal, how: plan}; saveData(h); this.textContent = "✅ บันทึกเรียบร้อย!"; this.style.opacity = 0.7; renderAdminList(); }
};

document.getElementById("rs").onclick=function(){ if(confirm("ต้องการเริ่มทำใหม่ทั้งหมดใช่หรือไม่?")) location.reload(); };

// -- ระบบหลังบ้าน (Admin) --
function renderAdminList(){
 var h=loadData(), el=document.getElementById("adminList"); el.innerHTML = ""; adminCharts = {};
 if(!h.length){ el.innerHTML='<p class="mut" style="text-align:center;padding:20px;">ยังไม่มีข้อมูลในระบบ</p>'; return; }
 
 h.forEach(function(r, idx){
   var mx = Math.max.apply(null, K.map(function(k){return r.s[k]}));
   var tops = K.filter(function(k){return r.s[k]===mx});
   
   // ใช้ชื่อบุคลิก TKI ภาษาไทยสำหรับระบบแอดมิน
   var domTkiNames = tops.map(function(k){ return N[k].split(" (")[0] }).join(", ");

   var card = document.createElement("div"); card.className = "card"; card.style.margin = "10px 0"; card.style.padding = "10px";
   var canvasId = "adminChart_" + idx;
   var barsHtml = K.map(function(k){ return '<div class="r'+(r.s[k]===mx?" top":"")+'"><b><span>'+N[k]+'</span><span>'+r.s[k]+'/12</span></b><div class="t"><i style="width:'+(r.s[k]/12*100)+'%"></i></div></div>'; }).join("");
   
   var isPre = r.w && r.w.indexOf("Pre") !== -1;
   card.innerHTML = 
     '<div class="acc-header" onclick="toggleAcc('+idx+', event)">'+
       '<div style="flex:1;"><div><span class="badge '+(isPre?"badge-pre":"badge-post")+'">'+(isPre?"Pre-test":"Post-test")+'</span><b style="color:var(--ac); font-size:1.05rem;">'+r.n+' ('+domTkiNames+')</b></div>'+
       '<div class="mut" style="font-size:0.85rem;margin-top:2px;">รหัส: '+r.id+' | <span>'+r.d+'</span></div></div>'+
       '<div style="display:flex;align-items:center;gap:10px;"><button class="del-btn" onclick="deleteSingle('+idx+', event)">🗑️ ลบ</button><span id="accIcon_'+idx+'">▼</span></div>'+
     '</div>'+
     '<div class="acc-body" id="accBody_'+idx+'">'+
       '<div style="max-width:320px; margin:10px auto;"><canvas id="'+canvasId+'"></canvas></div>'+
       '<div>'+barsHtml+'</div>'+
       (r.plan && r.plan.goal ?'<div style="margin-top:10px;padding:8px;background:#fff9e6;border-radius:6px;font-size:0.9rem;"><b>เป้าหมาย:</b> '+r.plan.goal+'<br><b>วิธีฝึก:</b> '+r.plan.how+'</div>':'')+
     '</div>';
   el.appendChild(card); adminCharts[idx] = { canvasId: canvasId, scores: r.s, instance: null };
 });
}

function toggleAcc(idx, e){
  if(e && e.target.tagName === "BUTTON") return;
  var body = document.getElementById("accBody_" + idx), icon = document.getElementById("accIcon_" + idx);
  if(body.classList.contains("open")){ body.classList.remove("open"); icon.textContent = "▼"; } 
  else { body.classList.add("open"); icon.textContent = "▲"; if(!adminCharts[idx].instance) adminCharts[idx].instance = createRadarChart(adminCharts[idx].canvasId, adminCharts[idx].scores); }
}

function deleteSingle(idx, e){
  if(e) e.stopPropagation();
  var h = loadData(); if(confirm("ต้องการลบข้อมูลประวัตินี้ใช่หรือไม่?")){ h.splice(idx, 1); saveData(h); renderAdminList(); }
}

var adm=document.getElementById("adminPanel");
document.getElementById("toggleAdmin").onclick=function(){
 var pass = prompt("กรุณากรอกรหัสผ่าน:");
 if(pass === "EE33") { renderAdminList(); adm.style.display="block"; adm.scrollIntoView({behavior:"smooth"}); } 
 else if(pass !== null) { alert("รหัสผ่านไม่ถูกต้อง!"); }
};
document.getElementById("closeAdmin").onclick=function(){ adm.style.display="none"; };

// ลบข้อมูลทั้งหมด
document.getElementById("clrAll").onclick=function(){ if(confirm("⚠️ ต้องการลบข้อมูลทั้งหมดจริงๆ ใช่หรือไม่? (กู้คืนไม่ได้)")){ saveData([]); renderAdminList(); } };

// ลบเฉพาะข้อมูล Test
document.getElementById("clrTest").onclick=function(){ 
  if(confirm("🧹 ต้องการลบข้อมูลที่ชื่อขึ้นต้นด้วยคำว่า 'Test' ทั้งหมดใช่หรือไม่?")){ 
    var h = loadData();
    var filtered = h.filter(function(x) { return !x.n.toLowerCase().startsWith("test"); });
    if(h.length !== filtered.length) {
      saveData(filtered); 
      renderAdminList();
      alert("ลบข้อมูล Test ทั้งหมดเรียบร้อยแล้ว");
    } else {
      alert("ไม่มีข้อมูล Test ให้ลบ");
    }
  } 
};

// ปุ่มสร้าง Mock Data 10 รายการ
document.getElementById("genMock").onclick=function(){
  var h = loadData();
  var startIdx = h.length + 1;
  
  for(var i = 0; i < 10; i++) {
    var num = i + 1;
    var numStr = (num < 10) ? "0" + num : num;
    var s = { C: Math.floor(Math.random()*5)+3, Co: Math.floor(Math.random()*5)+3, Cm: Math.floor(Math.random()*5)+3, Av: Math.floor(Math.random()*5)+3, Ac: Math.floor(Math.random()*5)+3 };
    var targetTrait = K[i % 5];
    s[targetTrait] = Math.floor(Math.random()*3) + 10;
    var w = (num <= 5) ? "Pre-test (ก่อนทำโครงการ)" : "Post-test (หลังทำโครงการ)";
    
    h.push({
      id_ref: Date.now() + i, 
      n: "Test " + num, 
      id: "67000000" + numStr.toString().padStart(3, '0'), 
      w: w, 
      d: new Date().toLocaleString("th-TH"), 
      s: s
    });
  }
  
  saveData(h); renderAdminList(); 
  alert("✨ สร้างข้อมูล Test สำเร็จ 10 รายการ");
};
